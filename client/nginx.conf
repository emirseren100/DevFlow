# Static hosting for the built DevFlow client.
#
# This is not a proxy: the browser calls the API directly on its own origin,
# which is why the API sets CORS and reads the Origin header.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The routes belong to React Router, so a deep link such as
    # /app/workspaces/abc/dashboard must serve index.html rather than 404 —
    # otherwise refreshing any page but "/" breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a long cache is safe: a new build
    # produces a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or the browser keeps loading the
    # previous build's asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
